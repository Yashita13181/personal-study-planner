{% extends "base.html" %}

{% block title %}Amend Task #{{ task.id }} &mdash; The Scholar's Ledger{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
  <div class="card-title">
    <span>✦ Amend Task Ref #{{ task.id }}</span>
    <a href="{{ url_for('tasks_view') }}" class="btn btn-sm">&larr; Return to Ledger</a>
  </div>

  <form action="{{ url_for('task_edit_post', task_id=task.id) }}" method="POST">
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Discipline / Subject</label>
        <input type="text" name="subject" class="form-control" value="{{ task.subject }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Deadline</label>
        <input type="text" name="deadline" class="form-control" value="{{ task.deadline }}" placeholder="today, +3d, YYYY-MM-DD" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Topic / Assignment Name</label>
      <input type="text" name="topic" class="form-control" value="{{ task.topic }}" required>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-control">
          <option value="High" {% if task.priority.value == 'High' %}selected{% endif %}>▲ High Priority</option>
          <option value="Medium" {% if task.priority.value == 'Medium' %}selected{% endif %}>■ Medium Priority</option>
          <option value="Low" {% if task.priority.value == 'Low' %}selected{% endif %}>▽ Low Priority</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="Pending" {% if task.status.value == 'Pending' %}selected{% endif %}>○ Pending</option>
          <option value="In Progress" {% if task.status.value == 'In Progress' %}selected{% endif %}>◐ In Progress</option>
          <option value="Completed" {% if task.status.value == 'Completed' %}selected{% endif %}>✓ Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Estimated Hours</label>
        <input type="number" step="0.5" min="0.1" name="estimated_hours" class="form-control" value="{{ task.estimated_hours }}">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Scholarly Notes / Annotations</label>
      <textarea name="notes" class="form-control">{{ task.notes }}</textarea>
    </div>

    <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
      <a href="{{ url_for('tasks_view') }}" class="btn">Cancel</a>
      <button type="submit" class="btn btn-gold">Save Amendments</button>
    </div>
  </form>
</div>
{% endblock %}
